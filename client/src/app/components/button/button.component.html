<button 
    [ngStyle]="{
        'background-image': backgroundImage,
        'color': backgroundImage,
        'background-color': backgroundImage,
        'width': width + 'px',
        'height': height + 'px',
    }"
    [routerLink]="route"
    [disabled]="disabled"
    [ngClass]="[
    'btn',
    'btn--' + variant,
    disabled ? 'disabled' : '',
    selected ? 'selected' : ''
    ]"
    (click)="onClick()"
    >
        <ng-content></ng-content>
</button>
