

<button 
    [routerLink]="route"
    [style.background-image]="backgroundImage"
    [style.color]="color" 
    [style.background-color]="backgroundColor" 
    [style.width.px]="width" 
    [style.height.px]="height"

    <ng-content></ng-content>

</button>
