<div class="gameCard">
  <div class="image-frame">
    <img
      [ngClass]="{hidden: !game.isVisible, visible: game.isVisible}"
      class="thumbnail"
      [src]="game.thumbnail"
      [alt]="game.name"
      (mouseenter)="onMouseEnter()"
      (mouseleave)="onMouseLeave()"
      (mousemove)="updateTooltipPosition()"
      #thumbnail
    />
  </div>

  <div class="card-info">
    <div class="card-header">
      <h3 class="game-name">{{ game.name }}</h3>
    </div>

    <div class="card-stats">
      <div class="stat-item">
        <span class="label">Taille :</span>
        <span class="value">{{ game.size.rows }} x {{ game.size.cols }}</span>
      </div>
      <div class="stat-item">
        <span class="label">Mode :</span>
        <span class="value">{{ game.gameMode == gameMode.Classic ? 'Classique' : 'CTF'}}</span>
      </div>
      <div class="stat-item">
        <span class="label">Dernière mise à jour :</span>
        <span class="value">{{ displayTime() }}</span>
      </div>
    </div>

    <div class="card-buttons">
      <ng-content></ng-content>
    </div>
  </div>
</div>

<div class="tooltip" [style.top.px]="tooltipVerticalPos" [style.left.px]="tooltipHorizontalPos" [style.opacity]="show ? 1 : 0" #tooltip>
  {{ game.description }}
</div>
