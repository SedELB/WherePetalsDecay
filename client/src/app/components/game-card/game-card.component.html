<li>
    <div class="game-card">
        <div class="image-frame">
            <img class="thumbnail" [src]="image" [alt]="name">
        </div>
        <div class="card-info">
            <ul>
                <li>{{ name }}</li>
                <li>{{ size }}</li>
                <li>{{ mode }}</li>
                <li>{{ lastModified }}</li>
            </ul>
            <div class="card-buttons">
                <ng-content></ng-content>
            </div>
        </div>
    </div>
</li>
