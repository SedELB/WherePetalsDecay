<div class="gameCard">
  <div class="image-frame">
    <img
      [ngClass]="{hidden: !game.isVisible, visible: game.isVisible}"
      class="thumbnail"
      [src]="game.thumbnail"
      [alt]="game.name"
      (mouseenter)="onMouseEnter()"
      (mouseleave)="onMouseLeave()"
      (mousemove)="updateTooltipPosition()"
      #thumbnail
    />
  </div>

  <div class="card-info">
    <ul>
      <li>Nom du jeu : <span>{{ game.name }}</span></li>
      <li>Taille du jeu : <span>{{ game.size.rows }}X{{ game.size.cols }}</span></li>
      <li>Mode de jeu : <span>{{ game.gameMode == gameMode.Classic ? 'Classique' : 'CTF'}}</span></li>
      <li>Dernière modification : <span>{{ displayTime() }}</span></li>
    </ul>

    <div class="card-buttons">
      <ng-content></ng-content>
    </div>
  </div>
</div>

<div class="tooltip" [style.top.px]="tooltipVerticalPos" [style.opacity]="show ? 1 : 0" #tooltip>
  {{ game.description }}
</div>
