<div class="container">
    <header class="game-header">
        <img src="assets/GrimStoneLogo.png" alt="Logo du jeu" class="game-logo" />
        <h1 class="game-title">{{ gameTitle }}</h1>
    </header>

    <nav class="menu-options">
        <button class="menu-button" disabled title="Disponible prochainement">
            Joindre une partie
        </button>

        <button class="menu-button" routerLink="/create">
            Créer une partie
        </button>

        <button class="menu-button" routerLink="/admin">
            Administrer les jeux
        </button>
    </nav>

    <footer class="team-info">
        <h3>Équipe {{ teamNumber }}</h3>
        <p>{{ teamMembers.join(', ') }}</p>
    </footer>
</div>
