<main class="main-container page-background">
    <app-button class="pos-back" [variant]="buttonVariant.Back" [route]="'/admin'"></app-button>
    
    <header class="page-header">
        <h2 class="page-title">Créer un jeu</h2>
        <p class="page-subtitle">Choisir une taille et un mode de jeu</p>
    </header>

    <div class="list-container board-container">
        <section class="choice-card">
            <h1 class="section-title">Choisir une taille :</h1>
            <div class="size-options">
                <div class="size-card">
                    <button type="button" class="marker-btn" [class.selected]="mapSize === mapSizeEnum.Small"
                                (click)="mapSizeSelected(mapSizeEnum.Small)">Petite</button>
                    <p class="size-label">10 X 10</p>
                    <p class="player-count">2 joueurs</p>
                </div>
                <div class="size-card">
                    <button type="button" class="marker-btn" [class.selected]="mapSize === mapSizeEnum.Medium"
                                (click)="mapSizeSelected(mapSizeEnum.Medium)">Moyenne</button>
                    <p class="size-label">15 X 15</p>
                    <p class="player-count">2 - 4 joueurs</p>
                </div>
                <div class="size-card">
                    <button type="button" class="marker-btn" [class.selected]="mapSize === mapSizeEnum.Large"
                                (click)="mapSizeSelected(mapSizeEnum.Large)">Grande</button>
                    <p class="size-label">20 X 20</p>
                    <p class="player-count">2 - 6 joueurs</p>
                </div>
            </div>
        </section>

        <section class="gamemode-choice">
            <h1 class="section-title">Choisir un mode de jeu :</h1>
            <div class="gamemode-button-group">
                <button type="button" class="marker-btn mode-btn" [class.selected]="gameMode === gameModeEnum.Classic"
                            (click)="gameModeSelected(gameModeEnum.Classic)">
                            Classique
                </button>

                <button type="button" class="marker-btn mode-btn" [class.selected]="gameMode === gameModeEnum.Ctf"
                            (click)="gameModeSelected(gameModeEnum.Ctf)">
                            CTF
                </button>
            </div>
        </section>
        
        <footer class="save-button-container">
            <app-button [disabled]="!canCreateGame" [width]="300" id="save-button" (clicked)="createAndNavigateToGameEditor()">Créer</app-button>
        </footer>
    </div>
</main>
