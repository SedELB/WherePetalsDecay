<div class="container">
    <app-button variant="back" [route]="routes.home"></app-button>
    <section class="game-selection">
        <h2>Joindre une partie</h2>
        <p>Sélectionnez une partie à rejoindre</p>

        <div class="list-container">
            @for(lobby of activeLobbies; track lobby.lobbyId) {
                <app-lobby-card [lobby]="lobby">
                    <app-button [height]="50" (clicked)="selectLobby(lobby)">Sélectionner</app-button>
                </app-lobby-card>
            } @empty {
                <p class="no-games">Aucun salon disponible</p>
            }
        </div>
    </section>
</div>
